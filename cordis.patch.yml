# EVE Map Assistant - DSH profile bundle patch layer.
#
# This file is the bundle's exported patch (package.json -> dsh.bundle.patch).
# It is applied automatically as one layer of the target profile when this
# package is added to the profile's `dsh.profile.bundles` (which `dsh plugin
# add` does for any dependency that declares `dsh.bundle`). No manual edit of
# the profile's own cordis.patch.yml is required.
#
# Effect: mount one @deepseek-ai/dsh-mcp-client stdio instance that spawns the
# MCP server already installed on the user PATH by the EVE Static Map Planner
# MSI (`eve-map-mcp.exe`, discovered through its own control lookup - no args,
# no fixed URL/port). Map tools surface to the model as `mcp__evemap__*`.
#
# Everything here is deliberately portable:
#   - no absolute executable path (command is a bare PATH-resolved name)
#   - no user name, no localhost port, no token/session key/control secret
#   - no HTTP transport, no shell wrapper

- insert:
    - id: mcp-eve-map
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: evemap
        transport: stdio
        command: eve-map-mcp.exe
