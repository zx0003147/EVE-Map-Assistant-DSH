# EVE Map Assistant - DSH profile bundle patch layer (v0.2.0).
#
# This file is the bundle's exported patch (package.json -> dsh.bundle.patch).
# It is applied automatically as one layer of the target profile when this
# package is added to the profile's `dsh.profile.bundles` (which `dsh plugin
# add` does for any dependency that declares `dsh.bundle`). No manual edit of
# the profile's own cordis.patch.yml is required.
#
# Compatibility: EVE Map Assistant Plugin 0.5.1 / EVE Static Map Planner 1.0.0
# expose the secure MCP bridge over a fixed localhost HTTP (streamable-http)
# endpoint at http://127.0.0.1:27892/mcp. The legacy STDIO bridge executable
# (eve-map-mcp.exe) is no longer installed by the planner, so this layer uses
# the HTTP transport instead. Map tools surface to the model as
# `mcp__eve-static-map__*` (the mcp__<serverName>__<rawName> naming scheme of
# @deepseek-ai/dsh-mcp-client), matching the plugin's canonical server name.

- insert:
    - id: mcp-eve-map
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: eve-static-map
        transport: streamable-http
        url: http://127.0.0.1:27892/mcp
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
